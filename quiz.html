<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevSpecs — AI Quiz</title>
<script>
  (function () {
    try {
      var stored = localStorage.getItem('revspecs-theme');
      var wantsDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (wantsDark) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap"></noscript>
<meta name="theme-color" id="themeColorMeta" content="#FFFFFF">
<style>
  :root{
    --paper: #FFFFFF;
    --panel: #FFFFFF;
    --ink: #1B4332;
    --ink-soft: #5C8374;
    --line: #CDE8D5;
    --y1: #E67E22;
    --y1-dark: #CF6C1B;
    --y2: #27AE60;
    --y2-dark: #219150;
    --y3: #D35400;
    --wrong: #C0392B;
    --radius: 3px;
    --shadow-tint: 0, 0, 0;
    --overlay-tint: 27, 67, 50;
    --about-panel: #c0ffca;
    --about-text: #245c33;
    --toggle-text: #517a51;
    --panel-heading: #10291b;
    color-scheme: light;
  }

  [data-theme="dark"]{
    --paper: #0F1E18;
    --panel: #16281F;
    --ink: #E9F5EE;
    --ink-soft: #93BCA9;
    --line: #2A4638;
    --y1: #F0964C;
    --y1-dark: #E67E22;
    --y2: #35C97A;
    --y2-dark: #27AE60;
    --y3: #EC711C;
    --wrong: #E85C4A;
    --shadow-tint: 0, 0, 0;
    --overlay-tint: 0, 0, 0;
    --about-panel: #16281F;
    --about-text: #E9F5EE;
    --toggle-text: #517a51;
    --panel-heading: #E9F5EE;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  /* ---------- Parallax background ---------- */
  .parallax-bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background: #000;
  }

  .parallax-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 320px;
    height: 178px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
  }

  .parallax-layer {
    position: absolute;
    left: 0;
    width: 100%;
    background-repeat: repeat-x;
    image-rendering: pixelated;
    pointer-events: none;
    will-change: background-position;
    backface-visibility: hidden;
  }

  .layer-sky {
    top: 0; height: 200px;
    background-image: url("Day/background_1_day.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    z-index: 1;
  }
  .layer-clouds-back  { bottom: 0; height: 120px; background-image: url("Day/background_2_day.png"); z-index: 2; }
  .layer-clouds-front { bottom: 0; height: 115px; background-image: url("Day/background_3_day.png"); z-index: 3; }
  .layer-water        { bottom: 0; height: 70px;  background-image: url("Day/background_5_day.png"); z-index: 4; }
  .layer-terrain      { bottom: 0; height: 89px;  background-image: url("Day/background_4_day.png"); z-index: 5; }
  .layer-grass        { bottom: 0; height: 40px;  background-image: url("Day/background_6_day.png"); z-index: 6; }

  [data-theme="dark"] .layer-sky          { background-image: url("Night/background_1_night.png"); }
  [data-theme="dark"] .layer-clouds-back  { background-image: url("Night/background_2_night.png"); }
  [data-theme="dark"] .layer-clouds-front { background-image: url("Night/background_3_night.png"); }
  [data-theme="dark"] .layer-water        { background-image: url("Night/background_5_night.png"); }
  [data-theme="dark"] .layer-terrain      { background-image: url("Night/background_4_night.png"); }
  [data-theme="dark"] .layer-grass        { background-image: url("Night/background_6_night.png"); }

  /* ---------- Page ---------- */
  body{
    margin:0;
    background:transparent;
    color:var(--ink);
    font-family:'Roboto', sans-serif;
    line-height:1.5;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* ---------- Back link: floating pill ---------- */
  .back-link{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    font-family:'Roboto Condensed', sans-serif;
    font-weight:700;
    font-size:0.9rem;
    color: var(--ink);
    text-decoration:none;
    margin-bottom: 16px;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    border: 1px solid var(--line);
    border-radius: 999px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .back-link:hover{ color: var(--y1); border-color: var(--y1); }

  /* ---------- Header card ---------- */
  header{
    margin-bottom: 24px;
    padding: 16px 20px;
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    border: 1px solid var(--line);
    border-radius: 12px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }

  h1{
    font-family:'Roboto Condensed', sans-serif;
    font-weight:700;
    font-size: 1.5rem;
    margin: 0 0 6px;
  }

  #progressText{
    font-size: 0.85rem;
    color: var(--ink);
  }

  /* Progress bar lives inside the header card now */
  .progress-track{
    height: 6px;
    background: rgba(0,0,0,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 12px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.10);
  }
  [data-theme="dark"] .progress-track{
    background: rgba(255,255,255,0.10);
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--y2);
    transition: width 0.25s ease;
  }

  /* ---------- Question card ---------- */
  .question-card{
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 26px;
    box-shadow: 0 4px 16px rgba(var(--shadow-tint), 0.20);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .type-badge{
    display:inline-block;
    font-family:'Roboto Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
    margin-bottom: 14px;
  }

  .question-text{
    font-size: 1.08rem;
    font-weight: 500;
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .answer-area{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .option-btn{
    text-align:left;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 16px;
    font-family:'Roboto', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    cursor:pointer;
    transition: border-color 0.12s ease, background-color 0.12s ease, opacity 0.12s ease;
  }
  .option-btn:hover:not(:disabled){ border-color: var(--y1); }
  .option-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }
  .option-btn:disabled{ cursor: default; }
  .option-btn:disabled:not(.correct):not(.incorrect){ opacity: 0.55; }
  .option-btn.correct{ background: var(--y2); border-color: var(--y2); color: #fff; opacity: 1; }
  .option-btn.incorrect{ background: var(--wrong); border-color: var(--wrong); color: #fff; opacity: 1; }

  .blank-input{
    display:inline-block;
    width: 100%;
    max-width: 220px;
    padding: 4px 8px;
    border: none;
    border-bottom: 2px solid var(--y1);
    background: transparent;
    font-family:'Roboto', sans-serif;
    font-size: 1rem;
    color: var(--ink);
    margin: 0 4px;
  }
  .blank-input:focus{ outline: none; border-bottom-color: var(--y2); }
  .blank-input.input-correct{ border-bottom-color: var(--y2); color: var(--y2); }
  .blank-input.input-incorrect{ border-bottom-color: var(--wrong); color: var(--wrong); }

  .answer-area .blank-input{ max-width: none; border: 2px solid var(--line); border-radius: var(--radius); padding: 11px 14px; margin: 0; }
  .answer-area .blank-input:focus{ border-color: var(--y1); }

  .check-btn{ align-self: flex-start; }

  .btn-next{
    margin-top: 18px;
    background: var(--y2);
    border: none;
    color: #fff;
    font-family:'Roboto Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 11px 18px;
    border-radius: var(--radius);
    cursor:pointer;
    transition: background-color 0.15s ease;
  }
  .btn-next:hover{ background: var(--y2-dark); }
  .btn-next:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  .feedback-box{
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: var(--radius);
    border-left: 4px solid var(--line);
  }
  .feedback-box.feedback-correct{ background: color-mix(in srgb, var(--y2) 12%, var(--paper)); border-left-color: var(--y2); }
  .feedback-box.feedback-incorrect{ background: color-mix(in srgb, var(--wrong) 12%, var(--paper)); border-left-color: var(--wrong); }

  .feedback-verdict{ margin: 0 0 6px; font-weight: 700; }
  .feedback-explanation{ margin: 0; color: var(--ink-soft); font-size: 0.92rem; }

  .results-score{ font-size: 2.2rem; font-weight: 700; margin: 0 0 4px; font-family:'Roboto Condensed', sans-serif; }
  .results-pct{ font-size: 1.2rem; color: var(--ink-soft); font-weight: 400; }
  .results-label{ margin: 0 0 22px; color: var(--ink-soft); }

  /* ---------- Native <details> review dropdown ---------- */
  .review-details{
    border-top: 1px solid var(--line);
    margin-top: 6px;
    padding-top: 4px;
  }

  .review-summary{
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    padding: 14px 0 12px;
    user-select: none;
    transition: color 0.15s ease;
  }
  .review-summary::-webkit-details-marker,
  .review-summary::marker { display: none; content: ''; }
  .review-summary:hover{ color: var(--y1); }
  .review-summary:focus-visible{
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    border-radius: var(--radius);
  }

  .review-chevron{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink);
    font-size: 0.7rem;
    line-height: 1;
    flex-shrink: 0;
    transition: transform 0.22s ease, background-color 0.15s ease, color 0.15s ease;
  }
  .review-details[open] .review-chevron{
    transform: rotate(180deg);
    background: var(--y2);
    color: #fff;
  }

  .review-content{
    padding: 4px 0 8px;
    animation: reviewFade 0.22s ease;
  }
  @keyframes reviewFade{
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .review-row{ padding: 14px 0; border-top: 1px solid var(--line); }
  .review-row:first-child{ border-top: none; padding-top: 4px; }
  .review-q{ font-weight: 500; margin: 0 0 6px; }
  .review-line{ margin: 0 0 3px; font-size: 0.88rem; }
  .review-wrong{ color: var(--wrong); font-weight: 700; }
  .review-right{ color: var(--y2); font-weight: 700; }
  .review-explanation{ margin: 6px 0 0; font-size: 0.85rem; color: var(--ink-soft); }

  .review-perfect{
    margin: 0;
    padding: 4px 0 8px;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  /* ============================================================
     FAB + About modal
     ============================================================ */
  .about-fab{
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    background: var(--y2);
    box-shadow: 0 4px 10px rgba(var(--shadow-tint), 0.25);
    z-index: 100;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
  }
  .about-fab:hover{ transform: scale(1.06); box-shadow: 0 6px 14px rgba(var(--shadow-tint), 0.3); }
  .about-fab:focus-visible{ outline: 3px solid var(--ink); outline-offset: 3px; }

  .about-fab-img{
    width: 100%;
    height: 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color: #fff;
    font-family:'Roboto Condensed', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align:center;
    object-fit: contain;
  }

  .about-overlay{
    position: fixed;
    inset: 0;
    background: rgba(var(--overlay-tint), 0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 200;
  }
  .about-overlay[hidden]{ display:none; }

  .about-modal{
    background: var(--about-panel);
    border-radius: var(--radius);
    border-top: 6px solid var(--y2);
    padding: 28px 30px;
    max-width: 480px;
    width: 100%;
    position: relative;
    box-shadow: 0 12px 30px rgba(var(--shadow-tint), 0.3);
    transition: background-color 0.2s ease;
  }

  .about-modal-close{
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--line);
    color: var(--ink);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .about-modal-close:hover{ background: var(--y3); color: #fff; }

  .about-modal h2{
    font-family:'Roboto Condensed', sans-serif;
    font-size: 1.2rem;
    margin: 0 0 10px;
    color: var(--y2);
    padding-right: 24px;
  }

  .about-modal p{
    margin: 0 0 18px;
    font-size: 0.92rem;
    color: var(--about-text);
  }

  .facebook-placeholder{
    display:inline-flex;
    align-items:center;
    gap: 10px;
    text-decoration:none;
    color: var(--about-text);
    font-size: 0.85rem;
    font-weight: 500;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: var(--radius);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .facebook-placeholder:hover{ border-color: var(--y1); color: var(--y1); }
  .facebook-placeholder .placeholder-thumb{
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 0.55rem;
    font-weight: 700;
    color: var(--about-text);
    flex-shrink:0;
  }

  .theme-toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    margin: 0 0 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .theme-toggle-row + .theme-toggle-row{ margin-top: -18px; }

  .theme-toggle-label{
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--toggle-text);
  }

  .theme-toggle{
    position: relative;
    width: 44px;
    height: 24px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--paper);
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .theme-toggle-thumb{
    position: absolute;
    top: 1px;
    left: 1px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink-soft);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }
  .theme-toggle[aria-checked="true"]{
    background: var(--y2);
    border-color: var(--y2);
  }
  .theme-toggle[aria-checked="true"] .theme-toggle-thumb{
    transform: translateX(20px);
    background: #fff;
  }
  .theme-toggle:focus-visible{
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  @media (max-width: 520px){
    .about-fab{ width: 56px; height: 56px; bottom: 16px; right: 16px; }
  }

  /* "Click me →" hint for the About FAB */
  .fab-hint {
    position: fixed;
    bottom: calc(24px + 32px);
    right:  calc(24px + 64px + 14px);
    transform: translateY(50%);
    white-space: nowrap;
    padding: 8px 14px;
    border-radius: 999px;
    font: 600 13px/1 'Roboto', sans-serif;
    color: #fff;
    background: #1f2430;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    z-index: 99;
    pointer-events: none;
    opacity: 0;
    animation: fabHintIn .45s ease-out .6s forwards,
               fabHintBob 1.8s ease-in-out 1.2s infinite;
    transition: opacity .3s ease, transform .3s ease;
  }
  .fab-hint::after {
    content: "";
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    border: 6px solid transparent;
    border-left-color: #1f2430;
  }
  [data-theme="dark"] .fab-hint        { background: #f1f3f7; color: #12151c; }
  [data-theme="dark"] .fab-hint::after { border-left-color: #f1f3f7; }

  @keyframes fabHintIn {
    from { opacity: 0; transform: translateY(50%) translateX(-8px); }
    to   { opacity: 1; transform: translateY(50%) translateX(0);    }
  }
  @keyframes fabHintBob {
    0%, 100% { transform: translateY(50%) translateX(0); }
    50%      { transform: translateY(50%) translateX(6px); }
  }
  .fab-hint.is-hidden {
    animation: none;
    opacity: 0;
    transform: translateY(50%) translateX(-8px);
  }

  @media (max-width: 520px) {
    .fab-hint {
      bottom: calc(16px + 28px);
      right:  calc(16px + 56px + 14px);
      font-size: 12px;
      padding: 7px 12px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .fab-hint { animation: fabHintIn .01s forwards; }
  }

  .credit-marquee{
    margin-top: 18px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
    overflow: hidden;
    position: relative;
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 20px,
      #000 calc(100% - 20px),
      transparent 100%
    );
    mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 20px,
      #000 calc(100% - 20px),
      transparent 100%
    );
  }
  .credit-marquee-track{
    display: inline-flex;
    gap: 60px;
    white-space: nowrap;
    will-change: transform;
    animation: creditScroll 18s linear infinite;
  }
  .credit-marquee-item{
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--about-text);
    opacity: 0.85;
  }
  .credit-marquee:hover .credit-marquee-track{
    animation-play-state: paused;
  }
  @keyframes creditScroll{
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .credit-marquee-track{ animation: none; overflow-x: auto; }
  }

  body.modal-open{ overflow: hidden; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- Parallax background -->
<div class="parallax-bg">
    <div class="parallax-stage" id="parallaxStage">
        <div class="parallax-layer layer-sky"          data-speed="0" data-tile="320"></div>
        <div class="parallax-layer layer-clouds-back"  data-speed="2" data-tile="160"></div>
        <div class="parallax-layer layer-clouds-front" data-speed="3" data-tile="160"></div>
        <div class="parallax-layer layer-water"        data-speed="4" data-tile="172"></div>
        <div class="parallax-layer layer-terrain"      data-speed="4" data-tile="172"></div>
        <div class="parallax-layer layer-grass"        data-speed="6" data-tile="151"></div>
    </div>
</div>

<div class="wrap">
  <a class="back-link" href="index.php">&larr; Back to RevSpecs</a>
  <header>
    <h1 id="quizTitle">Loading quiz…</h1>
    <div id="progressText"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>
  <div id="quizBody"></div>
</div>

<!-- Floating About button -->
<button class="about-fab" id="aboutBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="aboutOverlay">
  <img src="specsLogo.png" class="about-fab-img" alt="SPECS logo">
</button>

<!-- "Click me →" hint -->
<span class="fab-hint" id="fabHint" aria-hidden="true">Click me&nbsp;→</span>

<div class="about-overlay" id="aboutOverlay" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
  <div class="about-modal">
    <button class="about-modal-close" id="aboutClose" aria-label="Close">&times;</button>
    <h2 id="aboutTitle">Gordon College &amp; SPECS</h2>
    <p>
      The Society of Programming Enthusiasts in Computer Science (SPECS) is an organization under the GCCCS
    </p>

    <div class="theme-toggle-row">
      <span class="theme-toggle-label" id="themeToggleLabel">Dark mode</span>
      <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-labelledby="themeToggleLabel">
        <span class="theme-toggle-thumb"></span>
      </button>
    </div>

    <div class="theme-toggle-row">
      <span class="theme-toggle-label" id="musicToggleLabel">Music</span>
      <button class="theme-toggle" id="musicToggle" role="switch" aria-checked="false" aria-labelledby="musicToggleLabel">
        <span class="theme-toggle-thumb"></span>
      </button>
    </div>

    <a class="facebook-placeholder" href="https://www.facebook.com/gcccsSPECS" target="_blank" rel="noopener">
      <span class="placeholder-thumb">FB</span>
      SPECS' Official Facebook Page
    </a>

    <div class="credit-marquee" aria-label="Music credit">
      <div class="credit-marquee-track">
        <span class="credit-marquee-item">♪ Clair de Lune — Claude Debussy</span>
        <span class="credit-marquee-item" aria-hidden="true">♪ Clair de Lune — Claude Debussy</span>
      </div>
    </div>
  </div>
</div>

<audio id="bgm" loop preload="auto">
  <source src="Music/Clair.mp3" type="audio/mpeg">
</audio>

<script>
  const TYPE_LABELS = {
    multiple_choice: 'Multiple choice',
    fill_blank: 'Fill in the blank',
    true_false: 'True or false',
    identification: 'Identification',
  };

  let items = [];
  let currentIndex = 0;
  let score = 0;
  let missed = [];
  let subjectLabel = '';

  function normalize(s) {
    return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function isTextCorrect(item, userText) {
    const candidates = [item.answer, ...(item.acceptableAnswers || [])].map(normalize);
    return candidates.includes(normalize(userText));
  }

  function getCorrectDisplay(item) {
    if (item.type === 'true_false') return item.answer ? 'True' : 'False';
    if (item.type === 'multiple_choice') return item.options[item.correctIndex];
    return item.answer;
  }

  function formatUserAnswer(item, userValue) {
    if (item.type === 'true_false') return userValue ? 'True' : 'False';
    if (item.type === 'multiple_choice') return item.options[userValue];
    return userValue;
  }

  function updateProgress() {
    document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${items.length}`;
    document.getElementById('progressFill').style.width = `${(currentIndex / items.length) * 100}%`;
  }

  function makeCheckButton(onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-next check-btn';
    btn.textContent = 'Check answer';
    btn.addEventListener('click', onClick);
    return btn;
  }

  function recordAnswer(item, userAnswerDisplay, correct) {
    if (!correct) {
      missed.push({
        question: item.question,
        userAnswerDisplay: userAnswerDisplay || '(blank)',
        correctAnswerDisplay: getCorrectDisplay(item),
        explanation: item.explanation,
      });
    }
  }

  function showFeedback(item, correct, revealAnswer) {
    if (correct) score++;
    const card = document.querySelector('.question-card');
    const box = document.createElement('div');
    box.className = 'feedback-box ' + (correct ? 'feedback-correct' : 'feedback-incorrect');

    const verdict = document.createElement('p');
    verdict.className = 'feedback-verdict';
    verdict.textContent = correct
      ? '✓ Correct!'
      : (revealAnswer ? `✗ Not quite — correct answer: ${revealAnswer}` : '✗ Not quite.');
    box.appendChild(verdict);

    const expl = document.createElement('p');
    expl.className = 'feedback-explanation';
    expl.textContent = item.explanation;
    box.appendChild(expl);

    const nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.className = 'btn-next';
    nextBtn.textContent = (currentIndex === items.length - 1) ? 'See results' : 'Next question →';
    nextBtn.addEventListener('click', goNext);
    box.appendChild(nextBtn);

    card.appendChild(box);
    nextBtn.focus();
  }

  function submitChoice(item, userValue, clickedBtn, answerArea) {
    const buttons = Array.from(answerArea.querySelectorAll('.option-btn'));
    buttons.forEach(b => b.disabled = true);

    let correct;
    if (item.type === 'true_false') {
      correct = (userValue === item.answer);
      buttons.forEach(b => { if ((b.textContent === 'True') === item.answer) b.classList.add('correct'); });
    } else {
      correct = (userValue === item.correctIndex);
      buttons.forEach((b, idx) => { if (idx === item.correctIndex) b.classList.add('correct'); });
    }
    if (!correct) clickedBtn.classList.add('incorrect');

    recordAnswer(item, formatUserAnswer(item, userValue), correct);
    showFeedback(item, correct);
  }

  function submitText(item, rawValue, card) {
    const input = card.querySelector('.blank-input');
    const checkBtn = card.querySelector('.check-btn');
    if (input) input.disabled = true;
    if (checkBtn) checkBtn.disabled = true;

    const correct = isTextCorrect(item, rawValue);
    if (input) input.classList.add(correct ? 'input-correct' : 'input-incorrect');

    recordAnswer(item, (rawValue || '').trim(), correct);
    showFeedback(item, correct, correct ? null : item.answer);
  }

  function renderQuestion() {
    const item = items[currentIndex];
    updateProgress();
    const body = document.getElementById('quizBody');
    body.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'question-card';

    const badge = document.createElement('span');
    badge.className = 'type-badge';
    badge.textContent = TYPE_LABELS[item.type] || item.type;
    card.appendChild(badge);

    const qEl = document.createElement('p');
    qEl.className = 'question-text';

    const answerArea = document.createElement('div');
    answerArea.className = 'answer-area';

    if (item.type === 'fill_blank' && item.question.includes('_____')) {
      const parts = item.question.split('_____');
      qEl.appendChild(document.createTextNode(parts[0]));
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'blank-input';
      input.autocomplete = 'off';
      input.spellcheck = false;
      qEl.appendChild(input);
      qEl.appendChild(document.createTextNode(parts.slice(1).join('_____')));
      card.appendChild(qEl);

      const checkBtn = makeCheckButton(() => submitText(item, input.value, card));
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); } });
      answerArea.appendChild(checkBtn);
      card.appendChild(answerArea);
      setTimeout(() => input.focus(), 0);

    } else if (item.type === 'identification' || item.type === 'fill_blank') {
      qEl.textContent = item.question;
      card.appendChild(qEl);
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'blank-input';
      input.placeholder = 'Type your answer';
      input.autocomplete = 'off';
      input.spellcheck = false;
      answerArea.appendChild(input);
      const checkBtn = makeCheckButton(() => submitText(item, input.value, card));
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); } });
      answerArea.appendChild(checkBtn);
      card.appendChild(answerArea);
      setTimeout(() => input.focus(), 0);

    } else if (item.type === 'true_false') {
      qEl.textContent = item.question;
      card.appendChild(qEl);
      ['True', 'False'].forEach(label => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = label;
        btn.addEventListener('click', () => submitChoice(item, label === 'True', btn, answerArea));
        answerArea.appendChild(btn);
      });
      card.appendChild(answerArea);

    } else {
      qEl.textContent = item.question;
      card.appendChild(qEl);
      (item.options || []).forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => submitChoice(item, idx, btn, answerArea));
        answerArea.appendChild(btn);
      });
      card.appendChild(answerArea);
    }

    body.appendChild(card);
  }

  function goNext() {
    currentIndex++;
    if (currentIndex >= items.length) {
      showResults();
    } else {
      renderQuestion();
    }
  }

  function resultsRemark(pct) {
    if (pct === 100) return 'Perfect score!';
    if (pct >= 80) return 'Great work — almost there.';
    if (pct >= 50) return 'Decent start — review the missed ones below.';
    return 'Worth another pass through the reviewer first.';
  }

  function showResults() {
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = 'Complete';

    const body = document.getElementById('quizBody');
    body.innerHTML = '';

    const pct = Math.round((score / items.length) * 100);
    const card = document.createElement('div');
    card.className = 'question-card';

    const scoreEl = document.createElement('p');
    scoreEl.className = 'results-score';
    scoreEl.innerHTML = `${score} / ${items.length} <span class="results-pct">(${pct}%)</span>`;
    card.appendChild(scoreEl);

    const labelEl = document.createElement('p');
    labelEl.className = 'results-label';
    labelEl.textContent = resultsRemark(pct);
    card.appendChild(labelEl);

    const details = document.createElement('details');
    details.className = 'review-details';

    const summary = document.createElement('summary');
    summary.className = 'review-summary';

    const summaryText = document.createElement('span');
    summaryText.className = 'review-summary-text';
    summary.appendChild(summaryText);

    const chevron = document.createElement('span');
    chevron.className = 'review-chevron';
    chevron.setAttribute('aria-hidden', 'true');
    chevron.textContent = '▼';
    summary.appendChild(chevron);

    details.appendChild(summary);

    const content = document.createElement('div');
    content.className = 'review-content';

    if (missed.length) {
      summaryText.textContent = `Show missed answers (${missed.length})`;

      details.addEventListener('toggle', () => {
        summaryText.textContent = details.open
          ? `Hide missed answers (${missed.length})`
          : `Show missed answers (${missed.length})`;
      });

      missed.forEach(m => {
        const row = document.createElement('div');
        row.className = 'review-row';

        const q = document.createElement('p');
        q.className = 'review-q';
        q.textContent = m.question;
        row.appendChild(q);

        const yourLine = document.createElement('p');
        yourLine.className = 'review-line';
        yourLine.appendChild(document.createTextNode('Your answer: '));
        const yourSpan = document.createElement('span');
        yourSpan.className = 'review-wrong';
        yourSpan.textContent = m.userAnswerDisplay;
        yourLine.appendChild(yourSpan);
        row.appendChild(yourLine);

        const correctLine = document.createElement('p');
        correctLine.className = 'review-line';
        correctLine.appendChild(document.createTextNode('Correct answer: '));
        const correctSpan = document.createElement('span');
        correctSpan.className = 'review-right';
        correctSpan.textContent = m.correctAnswerDisplay;
        correctLine.appendChild(correctSpan);
        row.appendChild(correctLine);

        const explEl = document.createElement('p');
        explEl.className = 'review-explanation';
        explEl.textContent = m.explanation;
        row.appendChild(explEl);

        content.appendChild(row);
      });

    } else {
      summaryText.textContent = 'Review answers';
      const perfect = document.createElement('p');
      perfect.className = 'review-perfect';
      perfect.textContent = '✓ Perfect score — nothing to review.';
      content.appendChild(perfect);
    }

    details.appendChild(content);
    card.appendChild(details);

    const retakeBtn = document.createElement('button');
    retakeBtn.type = 'button';
    retakeBtn.className = 'btn-next';
    retakeBtn.textContent = 'Retake quiz';
    retakeBtn.addEventListener('click', () => {
      currentIndex = 0; score = 0; missed = [];
      renderQuestion();
    });
    card.appendChild(retakeBtn);

    body.appendChild(card);
  }

  function showError(msg) {
    document.getElementById('quizTitle').textContent = subjectLabel || 'Quiz unavailable';
    document.getElementById('progressText').textContent = '';
    document.getElementById('progressFill').style.width = '0%';
    const body = document.getElementById('quizBody');
    body.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'question-card';
    const p = document.createElement('p');
    p.className = 'question-text';
    p.style.marginBottom = '0';
    p.textContent = msg;
    card.appendChild(p);
    body.appendChild(card);
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const subjectCode = params.get('subject');
    subjectLabel = params.get('name') || subjectCode || 'Quiz';
    document.title = `RevSpecs — ${subjectLabel} Quiz`;

    if (!subjectCode) {
      showError('No subject was specified — go back and pick one from RevSpecs.');
      return;
    }

    try {
      const res = await fetch('generate_quiz.php' + window.location.search);
      const data = await res.json().catch(() => null);

      if (!res.ok || !data) {
        showError((data && data.error) || 'Could not load this quiz.');
        return;
      }
      if (!Array.isArray(data.items) || !data.items.length) {
        showError('This quiz has no questions yet.');
        return;
      }

      items = data.items;
      document.getElementById('quizTitle').textContent = `${subjectLabel} — AI Quiz`;
      renderQuestion();
    } catch (err) {
      showError('Could not reach the server. Please try again.');
    }
  }

  init();

  /* ============================================================
     Modal helper
     ============================================================ */
  const openOverlays = [];

  function setupModal(overlay, { onOpen, onClose } = {}) {
    let lastFocused = null;

    function getFocusable() {
      return Array.from(
        overlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
      ).filter(el => el.offsetParent !== null);
    }

    function open(trigger) {
      lastFocused = trigger || document.activeElement;
      overlay.hidden = false;
      document.body.classList.add('modal-open');
      if (onOpen) onOpen();
      const focusable = getFocusable();
      (focusable[0] || overlay).focus();
    }

    function close() {
      if (overlay.hidden) return;
      overlay.hidden = true;
      document.body.classList.remove('modal-open');
      if (onClose) onClose();
      if (lastFocused) lastFocused.focus();
    }

    overlay.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const focusable = getFocusable();
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) close();
    });

    const controller = { overlay, open, close };
    openOverlays.push(controller);
    return controller;
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    openOverlays.forEach(({ overlay, close }) => { if (!overlay.hidden) close(); });
  });

  /* About modal */
  const aboutBtn = document.getElementById('aboutBtn');
  const aboutOverlay = document.getElementById('aboutOverlay');
  const aboutClose = document.getElementById('aboutClose');

  const aboutModal = setupModal(aboutOverlay, {
    onOpen: () => aboutBtn.setAttribute('aria-expanded', 'true'),
    onClose: () => aboutBtn.setAttribute('aria-expanded', 'false'),
  });

  aboutBtn.addEventListener('click', () => aboutModal.open(aboutBtn));
  aboutClose.addEventListener('click', () => aboutModal.close());

  /* "Click me →" hint */
  (function () {
    var HINT_KEY     = 'revspecs-fab-hint-seen';
    var AUTO_HIDE_MS = 9000;

    var hint = document.getElementById('fabHint');
    if (!hint) return;

    try {
      if (localStorage.getItem(HINT_KEY) === '1') { hint.remove(); return; }
    } catch (e) {}

    var dismissed = false;

    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      hint.classList.add('is-hidden');
      setTimeout(function () { hint.remove(); }, 400);
      try { localStorage.setItem(HINT_KEY, '1'); } catch (e) {}
    }

    var timer = setTimeout(dismiss, AUTO_HIDE_MS);

    aboutBtn.addEventListener('click', function () {
      clearTimeout(timer);
      dismiss();
    }, { once: true });
  })();

  /* Dark mode toggle */
  const THEME_KEY = 'revspecs-theme';
  const themeToggle = document.getElementById('themeToggle');
  const themeColorMeta = document.getElementById('themeColorMeta');

  function applyTheme(theme){
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggle.setAttribute('aria-checked', 'true');
      themeColorMeta.setAttribute('content', '#0F1E18');
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeToggle.setAttribute('aria-checked', 'false');
      themeColorMeta.setAttribute('content', '#FFFFFF');
    }
  }

  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

  themeToggle.addEventListener('click', () => {
    const next = themeToggle.getAttribute('aria-checked') === 'true' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  /* Cross-tab theme sync */
  window.addEventListener('storage', function (e) {
    if (e.key !== 'revspecs-theme') return;
    applyTheme(e.newValue === 'dark' ? 'dark' : 'light');
  });

  /* Background music */
  (function () {
    var MUSIC_KEY = 'revspecs-music-on';
    var VOLUME    = 0.35;

    var btn = document.getElementById('musicToggle');
    var bgm = document.getElementById('bgm');
    if (!btn || !bgm) return;

    bgm.volume = VOLUME;

    function syncUI() {
      var playing = !bgm.paused && !bgm.ended;
      btn.setAttribute('aria-checked', playing ? 'true' : 'false');
    }

    bgm.addEventListener('play',  syncUI);
    bgm.addEventListener('pause', syncUI);
    bgm.addEventListener('ended', syncUI);

    function play() {
      var p = bgm.play();
      if (p && p.catch) p.catch(function () {});
    }
    function pause() { bgm.pause(); }

    syncUI();

    try {
      if (localStorage.getItem(MUSIC_KEY) === '1') play();
    } catch (e) {}

    btn.addEventListener('click', function () {
      if (bgm.paused) play(); else pause();
      try {
        localStorage.setItem(MUSIC_KEY, bgm.paused ? '0' : '1');
      } catch (e) {}
    });
  })();

  /* ============================================================
     Parallax background animation
     ============================================================ */
  (function () {
    const stage = document.getElementById('parallaxStage');
    if (!stage) return;

    const STAGE_W = 320;
    const STAGE_H = 178;

    function fitStage() {
      const scale = Math.max(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
      stage.style.setProperty('--scale', scale);
    }

    window.addEventListener('resize', fitStage);
    fitStage();

    const layers = Array.from(document.querySelectorAll('.parallax-layer')).map(el => ({
      el,
      speed: parseFloat(el.dataset.speed) || 0,
      tile: parseFloat(el.dataset.tile) || 0,
      offset: 0
    }));

    let last = performance.now();

    function tick(now) {
      const dt = (now - last) / 1000;
      last = now;

      for (const layer of layers) {
        if (layer.tile > 0) {
          layer.offset = (layer.offset + layer.speed * dt) % layer.tile;
        }
        layer.el.style.backgroundPositionX = (-layer.offset).toFixed(2) + 'px';
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
