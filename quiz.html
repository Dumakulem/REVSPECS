<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevSpecs — AI Quiz</title>
<script>
  (function () {
    try {
      var stored = localStorage.getItem('revspecs-theme');
      var wantsDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (wantsDark) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap"></noscript>
<meta name="theme-color" id="themeColorMeta" content="#FFFFFF">
<style>
  :root{
    --paper: #FFFFFF;
    --panel: #FFFFFF;
    --ink: #1B4332;
    --ink-soft: #5C8374;
    --line: #CDE8D5;
    --y1: #E67E22;
    --y1-dark: #CF6C1B;
    --y2: #27AE60;
    --y2-dark: #219150;
    --y3: #D35400;
    --wrong: #C0392B;
    --radius: 3px;
    --shadow-tint: 0, 0, 0;
    color-scheme: light;
  }

  [data-theme="dark"]{
    --paper: #0F1E18;
    --panel: #16281F;
    --ink: #E9F5EE;
    --ink-soft: #93BCA9;
    --line: #2A4638;
    --y1: #F0964C;
    --y1-dark: #E67E22;
    --y2: #35C97A;
    --y2-dark: #27AE60;
    --y3: #EC711C;
    --wrong: #E85C4A;
    --shadow-tint: 0, 0, 0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Roboto', sans-serif;
    line-height:1.5;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .back-link{
    display:inline-block;
    font-family:'Roboto Condensed', sans-serif;
    font-weight:700;
    font-size:0.9rem;
    color: var(--ink-soft);
    text-decoration:none;
    margin-bottom: 20px;
  }
  .back-link:hover{ color: var(--y1); }

  header{ margin-bottom: 18px; }

  h1{
    font-family:'Roboto Condensed', sans-serif;
    font-weight:700;
    font-size: 1.5rem;
    margin: 0 0 6px;
  }

  #progressText{
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .progress-track{
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--y2);
    transition: width 0.25s ease;
  }

  .question-card{
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 26px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .type-badge{
    display:inline-block;
    font-family:'Roboto Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
    margin-bottom: 14px;
  }

  .question-text{
    font-size: 1.08rem;
    font-weight: 500;
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .answer-area{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .option-btn{
    text-align:left;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 16px;
    font-family:'Roboto', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    cursor:pointer;
    transition: border-color 0.12s ease, background-color 0.12s ease, opacity 0.12s ease;
  }
  .option-btn:hover:not(:disabled){ border-color: var(--y1); }
  .option-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }
  .option-btn:disabled{ cursor: default; }
  .option-btn:disabled:not(.correct):not(.incorrect){ opacity: 0.55; }
  .option-btn.correct{ background: var(--y2); border-color: var(--y2); color: #fff; opacity: 1; }
  .option-btn.incorrect{ background: var(--wrong); border-color: var(--wrong); color: #fff; opacity: 1; }

  .blank-input{
    display:inline-block;
    width: 100%;
    max-width: 220px;
    padding: 4px 8px;
    border: none;
    border-bottom: 2px solid var(--y1);
    background: transparent;
    font-family:'Roboto', sans-serif;
    font-size: 1rem;
    color: var(--ink);
    margin: 0 4px;
  }
  .blank-input:focus{ outline: none; border-bottom-color: var(--y2); }
  .blank-input.input-correct{ border-bottom-color: var(--y2); color: var(--y2); }
  .blank-input.input-incorrect{ border-bottom-color: var(--wrong); color: var(--wrong); }

  .answer-area .blank-input{ max-width: none; border: 2px solid var(--line); border-radius: var(--radius); padding: 11px 14px; margin: 0; }
  .answer-area .blank-input:focus{ border-color: var(--y1); }

  .check-btn{ align-self: flex-start; }

  .btn-next{
    margin-top: 18px;
    background: var(--y2);
    border: none;
    color: #fff;
    font-family:'Roboto Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 11px 18px;
    border-radius: var(--radius);
    cursor:pointer;
    transition: background-color 0.15s ease;
  }
  .btn-next:hover{ background: var(--y2-dark); }
  .btn-next:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  .feedback-box{
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: var(--radius);
    border-left: 4px solid var(--line);
  }
  .feedback-box.feedback-correct{ background: color-mix(in srgb, var(--y2) 12%, var(--paper)); border-left-color: var(--y2); }
  .feedback-box.feedback-incorrect{ background: color-mix(in srgb, var(--wrong) 12%, var(--paper)); border-left-color: var(--wrong); }

  .feedback-verdict{ margin: 0 0 6px; font-weight: 700; }
  .feedback-explanation{ margin: 0; color: var(--ink-soft); font-size: 0.92rem; }

  .results-score{ font-size: 2.2rem; font-weight: 700; margin: 0 0 4px; font-family:'Roboto Condensed', sans-serif; }
  .results-pct{ font-size: 1.2rem; color: var(--ink-soft); font-weight: 400; }
  .results-label{ margin: 0 0 22px; color: var(--ink-soft); }

  /* ---------- Native <details> review dropdown ---------- */
  .review-details{
    border-top: 1px solid var(--line);
    margin-top: 6px;
    padding-top: 4px;
  }

  .review-summary{
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    padding: 14px 0 12px;
    user-select: none;
    transition: color 0.15s ease;
  }
  .review-summary::-webkit-details-marker,
  .review-summary::marker { display: none; content: ''; }
  .review-summary:hover{ color: var(--y1); }
  .review-summary:focus-visible{
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    border-radius: var(--radius);
  }

  .review-chevron{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink);
    font-size: 0.7rem;
    line-height: 1;
    flex-shrink: 0;
    transition: transform 0.22s ease, background-color 0.15s ease, color 0.15s ease;
  }
  .review-details[open] .review-chevron{
    transform: rotate(180deg);
    background: var(--y2);
    color: #fff;
  }

  .review-content{
    padding: 4px 0 8px;
    animation: reviewFade 0.22s ease;
  }
  @keyframes reviewFade{
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .review-row{ padding: 14px 0; border-top: 1px solid var(--line); }
  .review-row:first-child{ border-top: none; padding-top: 4px; }
  .review-q{ font-weight: 500; margin: 0 0 6px; }
  .review-line{ margin: 0 0 3px; font-size: 0.88rem; }
  .review-wrong{ color: var(--wrong); font-weight: 700; }
  .review-right{ color: var(--y2); font-weight: 700; }
  .review-explanation{ margin: 6px 0 0; font-size: 0.85rem; color: var(--ink-soft); }

  /* Shown when there are zero missed answers */
  .review-perfect{
    margin: 0;
    padding: 4px 0 8px;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.php">&larr; Back to RevSpecs</a>
  <header>
    <h1 id="quizTitle">Loading quiz…</h1>
    <div id="progressText"></div>
  </header>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quizBody"></div>
</div>

<script>
  const TYPE_LABELS = {
    multiple_choice: 'Multiple choice',
    fill_blank: 'Fill in the blank',
    true_false: 'True or false',
    identification: 'Identification',
  };

  let items = [];
  let currentIndex = 0;
  let score = 0;
  let missed = [];
  let subjectLabel = '';

  function normalize(s) {
    return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function isTextCorrect(item, userText) {
    const candidates = [item.answer, ...(item.acceptableAnswers || [])].map(normalize);
    return candidates.includes(normalize(userText));
  }

  function getCorrectDisplay(item) {
    if (item.type === 'true_false') return item.answer ? 'True' : 'False';
    if (item.type === 'multiple_choice') return item.options[item.correctIndex];
    return item.answer;
  }

  function formatUserAnswer(item, userValue) {
    if (item.type === 'true_false') return userValue ? 'True' : 'False';
    if (item.type === 'multiple_choice') return item.options[userValue];
    return userValue;
  }

  function updateProgress() {
    document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${items.length}`;
    document.getElementById('progressFill').style.width = `${(currentIndex / items.length) * 100}%`;
  }

  function makeCheckButton(onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-next check-btn';
    btn.textContent = 'Check answer';
    btn.addEventListener('click', onClick);
    return btn;
  }

  function recordAnswer(item, userAnswerDisplay, correct) {
    if (!correct) {
      missed.push({
        question: item.question,
        userAnswerDisplay: userAnswerDisplay || '(blank)',
        correctAnswerDisplay: getCorrectDisplay(item),
        explanation: item.explanation,
      });
    }
  }

  function showFeedback(item, correct, revealAnswer) {
    if (correct) score++;
    const card = document.querySelector('.question-card');
    const box = document.createElement('div');
    box.className = 'feedback-box ' + (correct ? 'feedback-correct' : 'feedback-incorrect');

    const verdict = document.createElement('p');
    verdict.className = 'feedback-verdict';
    verdict.textContent = correct
      ? '✓ Correct!'
      : (revealAnswer ? `✗ Not quite — correct answer: ${revealAnswer}` : '✗ Not quite.');
    box.appendChild(verdict);

    const expl = document.createElement('p');
    expl.className = 'feedback-explanation';
    expl.textContent = item.explanation;
    box.appendChild(expl);

    const nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.className = 'btn-next';
    nextBtn.textContent = (currentIndex === items.length - 1) ? 'See results' : 'Next question →';
    nextBtn.addEventListener('click', goNext);
    box.appendChild(nextBtn);

    card.appendChild(box);
    nextBtn.focus();
  }

  function submitChoice(item, userValue, clickedBtn, answerArea) {
    const buttons = Array.from(answerArea.querySelectorAll('.option-btn'));
    buttons.forEach(b => b.disabled = true);

    let correct;
    if (item.type === 'true_false') {
      correct = (userValue === item.answer);
      buttons.forEach(b => { if ((b.textContent === 'True') === item.answer) b.classList.add('correct'); });
    } else {
      correct = (userValue === item.correctIndex);
      buttons.forEach((b, idx) => { if (idx === item.correctIndex) b.classList.add('correct'); });
    }
    if (!correct) clickedBtn.classList.add('incorrect');

    recordAnswer(item, formatUserAnswer(item, userValue), correct);
    showFeedback(item, correct);
  }

  function submitText(item, rawValue, card) {
    const input = card.querySelector('.blank-input');
    const checkBtn = card.querySelector('.check-btn');
    if (input) input.disabled = true;
    if (checkBtn) checkBtn.disabled = true;

    const correct = isTextCorrect(item, rawValue);
    if (input) input.classList.add(correct ? 'input-correct' : 'input-incorrect');

    recordAnswer(item, (rawValue || '').trim(), correct);
    showFeedback(item, correct, correct ? null : item.answer);
  }

  function renderQuestion() {
    const item = items[currentIndex];
    updateProgress();
    const body = document.getElementById('quizBody');
    body.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'question-card';

    const badge = document.createElement('span');
    badge.className = 'type-badge';
    badge.textContent = TYPE_LABELS[item.type] || item.type;
    card.appendChild(badge);

    const qEl = document.createElement('p');
    qEl.className = 'question-text';

    const answerArea = document.createElement('div');
    answerArea.className = 'answer-area';

    if (item.type === 'fill_blank' && item.question.includes('_____')) {
      const parts = item.question.split('_____');
      qEl.appendChild(document.createTextNode(parts[0]));
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'blank-input';
      input.autocomplete = 'off';
      input.spellcheck = false;
      qEl.appendChild(input);
      qEl.appendChild(document.createTextNode(parts.slice(1).join('_____')));
      card.appendChild(qEl);

      const checkBtn = makeCheckButton(() => submitText(item, input.value, card));
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); } });
      answerArea.appendChild(checkBtn);
      card.appendChild(answerArea);
      setTimeout(() => input.focus(), 0);

    } else if (item.type === 'identification' || item.type === 'fill_blank') {
      qEl.textContent = item.question;
      card.appendChild(qEl);
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'blank-input';
      input.placeholder = 'Type your answer';
      input.autocomplete = 'off';
      input.spellcheck = false;
      answerArea.appendChild(input);
      const checkBtn = makeCheckButton(() => submitText(item, input.value, card));
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); } });
      answerArea.appendChild(checkBtn);
      card.appendChild(answerArea);
      setTimeout(() => input.focus(), 0);

    } else if (item.type === 'true_false') {
      qEl.textContent = item.question;
      card.appendChild(qEl);
      ['True', 'False'].forEach(label => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = label;
        btn.addEventListener('click', () => submitChoice(item, label === 'True', btn, answerArea));
        answerArea.appendChild(btn);
      });
      card.appendChild(answerArea);

    } else { // multiple_choice
      qEl.textContent = item.question;
      card.appendChild(qEl);
      (item.options || []).forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => submitChoice(item, idx, btn, answerArea));
        answerArea.appendChild(btn);
      });
      card.appendChild(answerArea);
    }

    body.appendChild(card);
  }

  function goNext() {
    currentIndex++;
    if (currentIndex >= items.length) {
      showResults();
    } else {
      renderQuestion();
    }
  }

  function resultsRemark(pct) {
    if (pct === 100) return 'Perfect score!';
    if (pct >= 80) return 'Great work — almost there.';
    if (pct >= 50) return 'Decent start — review the missed ones below.';
    return 'Worth another pass through the reviewer first.';
  }

  function showResults() {
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = 'Complete';

    const body = document.getElementById('quizBody');
    body.innerHTML = '';

    const pct = Math.round((score / items.length) * 100);
    const card = document.createElement('div');
    card.className = 'question-card';

    const scoreEl = document.createElement('p');
    scoreEl.className = 'results-score';
    scoreEl.innerHTML = `${score} / ${items.length} <span class="results-pct">(${pct}%)</span>`;
    card.appendChild(scoreEl);

    const labelEl = document.createElement('p');
    labelEl.className = 'results-label';
    labelEl.textContent = resultsRemark(pct);
    card.appendChild(labelEl);

    /* ---- Native <details> dropdown for missed answers ---- */
    const details = document.createElement('details');
    details.className = 'review-details';

    const summary = document.createElement('summary');
    summary.className = 'review-summary';

    const summaryText = document.createElement('span');
    summaryText.className = 'review-summary-text';
    summary.appendChild(summaryText);

    const chevron = document.createElement('span');
    chevron.className = 'review-chevron';
    chevron.setAttribute('aria-hidden', 'true');
    chevron.textContent = '▼';
    summary.appendChild(chevron);

    details.appendChild(summary);

    const content = document.createElement('div');
    content.className = 'review-content';

    if (missed.length) {
      summaryText.textContent = `Show missed answers (${missed.length})`;

      details.addEventListener('toggle', () => {
        summaryText.textContent = details.open
          ? `Hide missed answers (${missed.length})`
          : `Show missed answers (${missed.length})`;
      });

      missed.forEach(m => {
        const row = document.createElement('div');
        row.className = 'review-row';

        const q = document.createElement('p');
        q.className = 'review-q';
        q.textContent = m.question;
        row.appendChild(q);

        const yourLine = document.createElement('p');
        yourLine.className = 'review-line';
        yourLine.appendChild(document.createTextNode('Your answer: '));
        const yourSpan = document.createElement('span');
        yourSpan.className = 'review-wrong';
        yourSpan.textContent = m.userAnswerDisplay;
        yourLine.appendChild(yourSpan);
        row.appendChild(yourLine);

        const correctLine = document.createElement('p');
        correctLine.className = 'review-line';
        correctLine.appendChild(document.createTextNode('Correct answer: '));
        const correctSpan = document.createElement('span');
        correctSpan.className = 'review-right';
        correctSpan.textContent = m.correctAnswerDisplay;
        correctLine.appendChild(correctSpan);
        row.appendChild(correctLine);

        const explEl = document.createElement('p');
        explEl.className = 'review-explanation';
        explEl.textContent = m.explanation;
        row.appendChild(explEl);

        content.appendChild(row);
      });

    } else {
      summaryText.textContent = 'Review answers';
      const perfect = document.createElement('p');
      perfect.className = 'review-perfect';
      perfect.textContent = '✓ Perfect score — nothing to review.';
      content.appendChild(perfect);
    }

    details.appendChild(content);
    card.appendChild(details);

    const retakeBtn = document.createElement('button');
    retakeBtn.type = 'button';
    retakeBtn.className = 'btn-next';
    retakeBtn.textContent = 'Retake quiz';
    retakeBtn.addEventListener('click', () => {
      currentIndex = 0; score = 0; missed = [];
      renderQuestion();
    });
    card.appendChild(retakeBtn);

    body.appendChild(card);
  }

  function showError(msg) {
    document.getElementById('quizTitle').textContent = subjectLabel || 'Quiz unavailable';
    document.getElementById('progressText').textContent = '';
    document.getElementById('progressFill').style.width = '0%';
    const body = document.getElementById('quizBody');
    body.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'question-card';
    const p = document.createElement('p');
    p.className = 'question-text';
    p.style.marginBottom = '0';
    p.textContent = msg;
    card.appendChild(p);
    body.appendChild(card);
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const subjectCode = params.get('subject');
    subjectLabel = params.get('name') || subjectCode || 'Quiz';
    document.title = `RevSpecs — ${subjectLabel} Quiz`;

    if (!subjectCode) {
      showError('No subject was specified — go back and pick one from RevSpecs.');
      return;
    }

    try {
      const res = await fetch('generate_quiz.php' + window.location.search);
      const data = await res.json().catch(() => null);

      if (!res.ok || !data) {
        showError((data && data.error) || 'Could not load this quiz.');
        return;
      }
      if (!Array.isArray(data.items) || !data.items.length) {
        showError('This quiz has no questions yet.');
        return;
      }

      items = data.items;
      document.getElementById('quizTitle').textContent = `${subjectLabel} — AI Quiz`;
      renderQuestion();
    } catch (err) {
      showError('Could not reach the server. Please try again.');
    }
  }

  init();
</script>
</body>
</html>
